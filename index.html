  // ============================
  //  DATE DISPLAY
  // ============================
  function renderDate() {
    const now = new Date();
    const options = {
      month: "long",
      day: "numeric",
      year: "numeric",
      weekday: "long"
    };
    const formatted = now.toLocaleDateString("en-US", options);

    const info = getTodayInfo();
    const type = info.type || "Unknown";
    const letterDay = info.day || "?";

    document.getElementById("dateDisplay").textContent =
      `${formatted} — ${type} • ${letterDay}`;
  }

  // ============================
  //  TIME PARSING HELPERS
  // ============================
  function parseTime(timeStr) {
    const [time, modifier] = timeStr.split(" ");
    let [hours, minutes] = time.split(":").map(Number);

    if (modifier === "PM" && hours !== 12) hours += 12;
    if (modifier === "AM" && hours === 12) hours = 0;

    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);
  }

  function isNowBetween(start, end) {
    const now = new Date();
    const startTime = parseTime(start);
    const endTime = parseTime(end);
    return now >= startTime && now <= endTime;
  }

  function getTimeLeft(end) {
    const now = new Date();
    const endTime = parseTime(end);
    const diff = endTime - now;

    if (diff <= 0) return "0m 0s";

    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    return `${mins}m ${secs}s`;
  }

  // ============================
  //  GET TODAY'S INFO
  // ============================
  function getTodayInfo() {
    const now = new Date();
    const key = now.toISOString().split("T")[0];

    return yearlyCalendar[key] || {
      schedule: "H",
      type: "No School",
      day: "A"
    };
  }

  // ============================
  //  RENDER SCHEDULE
  // ============================
  function renderSchedule() {
    const info = getTodayInfo();
    const chosenSchedule = info.schedule;
    const schedule = schedules[chosenSchedule];
    let output = "";

    if (Array.isArray(schedule)) {
      schedule.forEach(period => {
        if (isNowBetween(period.start, period.end)) {
          const timeLeft = getTimeLeft(period.end);
          output += `<span style="color:red">${period.name}, ${period.start} - ${period.end} - ${timeLeft}</span>\n`;
        } else {
          output += `<span style="color:black">${period.name}, ${period.start} - ${period.end}</span>\n`;
        }
      });
    } else {
      output = schedule;
    }

    document.getElementById("dailyText").innerHTML = output;
  }

  // ============================
  //  INITIAL + INTERVAL UPDATE
  // ============================
  renderDate();
  renderSchedule();

  setInterval(() => {
    renderDate();
    renderSchedule();
  }, 1000);
